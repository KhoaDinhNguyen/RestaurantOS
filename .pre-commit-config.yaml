# Run once after cloning:   uv run pre-commit install --install-hooks
# Bump every hook at once:   uv run pre-commit autoupdate
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
exclude: ^(uv\.lock|frontend/package-lock\.json|data/|snapshots/|runs/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  # Python: ruff replaces black (ruff-format) and isort (rule set "I").
  # Lint with --fix must run before the formatter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Keeps uv.lock in step with pyproject.toml.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.7
    hooks:
      - id: uv-lock

  # SQL: lint only. Run `uv run sqlfluff fix db/` by hand when you want fixes.
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.5.0
    hooks:
      - id: sqlfluff-lint
        files: ^db/.*\.sql$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        args: [--fix]

  # Frontend: use the versions pinned in frontend/package.json, so the hook,
  # the editor and CI all agree. Needs `npm ci` in frontend/ first.
  # (pre-commit/mirrors-prettier is archived, so prettier is a local hook.)
  - repo: local
    hooks:
      - id: frontend-eslint
        name: eslint (frontend)
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        entry: bash -c 'cd frontend && npx --no-install eslint --fix "${@#frontend/}"' --
      - id: frontend-prettier
        name: prettier (frontend)
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx|css|json|html)$
        entry: bash -c 'cd frontend && npx --no-install prettier --write "${@#frontend/}"' --

  # Commit messages: Conventional Commits, e.g. "feat(gateway): route by geohash".
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, test, refactor, perf, chore, ci, build]
