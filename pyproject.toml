[project]
name = "restaurantos"
version = "0.1.0"
description = "Distributed restaurant management system for multi-location food businesses (CSE 512, Group 2)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
    # TODO: fill in, one entry per member
    { name = "Mark Loo", email = "junzingl@asu.edu" },
    { name = "TODO", email = "TODO@asu.edu" },
]

# Runtime dependencies: everything a service container needs.
# Lower bounds only; uv.lock holds the exact versions everyone runs.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[c,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "typer>=0.12",
    "pygeohash",
]

[project.scripts]
rosctl = "restaurantos.sim.cli:app"

# Development-only dependencies (PEP 735). `uv sync` installs them by default;
# service images use `uv sync --no-dev`.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.17",
    "sqlfluff>=4.2",
    "pre-commit>=4",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "restaurantos"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting (replaces isort)
    "B",       # bugbear
    "UP",      # modern syntax
    "SIM",     # simplifications
]

[tool.ruff.lint.isort]
known-first-party = ["restaurantos"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs PostgreSQL (CI service container or `docker compose up`)",
    "cluster: needs the full Compose cluster with Toxiproxy; never run in CI",
]

[tool.sqlfluff.core]
dialect = "postgres"
templater = "placeholder"
max_line_length = 100

[tool.sqlfluff.templater.placeholder]
# psycopg named parameters: %(vendor_id)s
param_style = "pyformat"

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"
