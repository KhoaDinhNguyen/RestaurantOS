# Shape of the cluster. Everything else (node IDs, Toxiproxy proxies, ports,
# link groups) is derived from this file by restaurantos.common.cluster.
#
# `rosctl bootstrap` reads this file and writes the cluster's Compose file and
# proxy list to infra/generated/ (git-ignored). Change this file, run
# bootstrap again; nothing else needs editing.
#
# The committed infra/compose.yaml and infra/toxiproxy/proxies.json are the
# dev baseline for the values below as committed (regions = 1). If you change
# the committed values, refresh the proxy list with
#     uv run python -m restaurantos.common.cluster --write
# and update infra/compose.yaml by hand; a unit test checks they still agree.

[cluster]
regions = 1          # r1 .. rN
standbys = true      # one streaming standby per primary (HQ included)
synchronous = false  # false: async standbys (default). true: synchronous commit

[toxiproxy]
base_port = 21000    # HQ proxies from 21000, region n from 21000 + 10 * n
