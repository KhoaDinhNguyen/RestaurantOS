name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: pre-commit (all files)
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          # Frontend hooks run in the frontend job.
          SKIP: frontend-eslint,frontend-prettier

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurantos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROS_TEST_DSN: postgresql://postgres:postgres@localhost:5432/restaurantos_test
    steps:
      - uses: actions/checkout@v5
      - name: libpq 17 or newer for psycopg[c] (PGDG repository, as in docs/setup.md)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y libpq-dev
          pg_config --version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # A new suffix starts a fresh cache, so a psycopg wheel that an
          # earlier run built against an older libpq is not reused.
          cache-suffix: libpq17
      - run: uv sync --locked
      - name: Unit and integration tests
        # "cluster" tests need the Compose cluster and Toxiproxy; run those locally.
        run: uv run pytest -m "not cluster" --cov=restaurantos --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      # Every later step is skipped until the UI owners add frontend/package.json.
      # (hashFiles() is not available in a job-level `if`, so the check is a step.)
      - name: Detect frontend project
        id: detect
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.detect.outputs.present == 'true'
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: steps.detect.outputs.present == 'true'
      - run: npm run lint
        if: steps.detect.outputs.present == 'true'
      - run: npx prettier --check .
        if: steps.detect.outputs.present == 'true'
      - run: npm test -- --run
        if: steps.detect.outputs.present == 'true'
      - run: npm run build
        if: steps.detect.outputs.present == 'true'
